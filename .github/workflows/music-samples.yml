name: 12 - Music options to Telegram
on: workflow_dispatch
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u reel/music_samples.py
      - run: |
          git config user.name "jms-bot"; git config user.email "jms-bot@users.noreply.github.com"
          git add reel/music; git commit -m "Music library" || true; git pull --rebase && git push
