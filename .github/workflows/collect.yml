name: 4 - Collect photos (no Gemini)
on:
  workflow_dispatch:
    inputs:
      per_category:
        description: "Target photos per category"
        default: "30"
      deadline_utc:
        description: "Stop at this UTC time (HH:MM)"
        default: "09:55"
permissions:
  contents: write
concurrency: jms-library
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect photos from free sources
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          git config user.name "jms-bot"
          git config user.email "jms-bot@users.noreply.github.com"
          python -u library/collect.py ${{ github.event.inputs.per_category || '30' }} ${{ github.event.inputs.deadline_utc || '09:55' }}
