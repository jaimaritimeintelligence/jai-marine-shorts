name: 11 - Own-voice self-test
on:
  workflow_dispatch:
    inputs:
      episode: {description: "episode folder", required: true, default: "nordbay-p1"}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r reel/requirements.txt
      - run: python -u reel/test_human.py reel/episodes/${{ github.event.inputs.episode }}/episode.json
      - uses: actions/upload-artifact@v4
        with: {name: humantest, path: "humantest*"}
