name: 2 - Publish to Instagram
on:
  schedule:
    - cron: "57 13 * * *"   # 19:27 IST
    - cron: "27 14 * * *"   # 19:57 IST (late approvals)
    - cron: "57 14 * * *"   # 20:27 IST
    - cron: "27 15 * * *"   # 20:57 IST - final try
  workflow_dispatch:
permissions:
  contents: write
concurrency: jms-daily
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Post if approved
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AUTO_POST: ${{ vars.AUTO_POST }}
          FINAL_TRY: ${{ github.event.schedule == '27 15 * * *' }}
        run: python publish.py
      - name: Save status
        if: always()
        run: |
          git config user.name "jms-bot"
          git config user.email "jms-bot@users.noreply.github.com"
          git add out
          git commit -m "Publish status $(TZ=Asia/Kolkata date +%F)" || echo "nothing to commit"
          git pull --rebase && git push
