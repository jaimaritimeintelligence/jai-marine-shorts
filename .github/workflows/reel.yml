name: 6 - Render Reel (case files / explainers)
on:
  push:
    paths:
      - "reel/episodes/*/episode.json"
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder name under reel/episodes (blank = newest changed)"
        required: false
      tts:
        description: "auto | gemini | edge"
        required: false
        default: "auto"
permissions:
  contents: write
concurrency: jms-reel
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r reel/requirements.txt
      - name: Pick episode
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then E="${{ github.event.inputs.episode }}";
          else E=$(git diff --name-only HEAD~1 HEAD -- 'reel/episodes/*/episode.json' | cut -d/ -f3 | tr '\n' ' '); fi
          echo "name=$E" >> $GITHUB_OUTPUT; echo "Episodes: $E"
      - name: Render and send preview to Telegram
        if: steps.ep.outputs.name != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TTS_MODE: ${{ github.event.inputs.tts || 'auto' }}
        run: for E in ${{ steps.ep.outputs.name }}; do python -u reel/preview.py reel/episodes/$E/episode.json; done
      - name: Save video to the repository
        if: steps.ep.outputs.name != ''
        run: |
          git config user.name "jms-bot"; git config user.email "jms-bot@users.noreply.github.com"
          for N in ${{ steps.ep.outputs.name }}; do E=reel/episodes/$N; rm -f $E/video.mp4 $E/voice.wav $E/music.wav; git add $E; done
          git commit -m "Reel rendered: ${{ steps.ep.outputs.name }}" || echo "nothing"
          git pull --rebase && git push
